# Step 31: baseline security headers, shared by every location.
#
# This lives in a snippet because nginx's `add_header` is additive only
# *within* one level: a `location` block that declares any `add_header`
# discards every header inherited from the `server` level. Declaring the
# policy once and including it in each location avoids that trap and keeps
# the two copies from drifting.
#
# The CSP matches what the Vite build actually emits: its own bundle as
# script, its own stylesheet, and same-origin API calls. No third-party
# origin, no inline script, no framing.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
