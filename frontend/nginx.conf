server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Step 31: do not advertise the nginx version to clients.
  server_tokens off;

  # Cap the request body nginx will buffer. Matches MAX_REQUEST_BYTES on
  # the API; both layers enforce it so an oversized payload is refused
  # before it is fully read.
  client_max_body_size 1m;

  # API reverse proxy: the SPA calls same-origin /api/*, which nginx
  # forwards to the backend over the Compose network (no CORS, no
  # hardcoded host ports in the built bundle).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Incident and audit detail must not be cached in an intermediary.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # SPA fallback WITHOUT $uri/: the built bundle ships a real "assets/"
  # directory (JS/CSS), and $uri/ would make nginx serve 403 for the
  # /assets route instead of the application. Static files still resolve
  # via $uri; everything else falls through to index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }

  # Never cache the SPA entry so new builds roll out cleanly.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Fingerprinted build assets are immutable.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
