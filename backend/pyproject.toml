[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Keep it simple: pyflakes (F), a focused subset of pycodestyle (E),
# and bugbear-style basics are deliberately NOT enabled yet.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
